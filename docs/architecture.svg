<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- group boxes -->
  <rect x="440" y="80" width="390" height="470" rx="14" fill="#fffaf2" stroke="#d9922b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="456" y="102" font-size="13" font-weight="600" fill="#9a5b00">RabbitMQ</text>
  <rect x="850" y="80" width="165" height="470" rx="14" fill="#f4fbf6" stroke="#4a9a6a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="866" y="102" font-size="13" font-weight="600" fill="#2b6b45">workers  :8081</text>

  <!-- external actors -->
  <rect x="8" y="215" width="127" height="52" rx="26" fill="#f4f4f6" stroke="#8a8a96"/>
  <text x="71" y="238" font-size="13" text-anchor="middle" fill="#222">Client</text>
  <text x="71" y="255" font-size="11" text-anchor="middle" fill="#666">merchant / admin</text>
  <rect x="8" y="333" width="127" height="52" rx="26" fill="#f4f4f6" stroke="#8a8a96"/>
  <text x="71" y="356" font-size="12.5" text-anchor="middle" fill="#222">Payment provider</text>
  <text x="71" y="373" font-size="11" text-anchor="middle" fill="#666">(simulator module)</text>

  <!-- api -->
  <rect x="200" y="235" width="160" height="130" rx="10" fill="#e9f6ee" stroke="#4a9a6a" stroke-width="1.5"/>
  <text x="280" y="262" font-size="14" font-weight="700" text-anchor="middle" fill="#15301f">api  :8080</text>
  <text x="280" y="284" font-size="11.5" text-anchor="middle" fill="#2a4a36">REST API · JWT auth</text>
  <text x="280" y="301" font-size="11.5" text-anchor="middle" fill="#2a4a36">charges · webhooks</text>
  <text x="280" y="318" font-size="11.5" text-anchor="middle" fill="#2a4a36">DLQ admin · Swagger UI</text>
  <text x="280" y="335" font-size="11.5" text-anchor="middle" fill="#2a4a36">health · metrics</text>

  <!-- redis -->
  <path d="M215,45 v50 a65,10 0 0 0 130,0 v-50" fill="#eef3fb" stroke="#5b7db1" stroke-width="1.5"/>
  <ellipse cx="280" cy="45" rx="65" ry="10" fill="#eef3fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="280" y="72" font-size="13" font-weight="600" text-anchor="middle" fill="#1b2a41">Redis</text>
  <text x="280" y="89" font-size="10" text-anchor="middle" fill="#41536f">event keys · login limits</text>

  <!-- exchange -->
  <polygon points="470,300 492,270 568,270 590,300 568,330 492,330" fill="#fff4e5" stroke="#d9922b" stroke-width="1.5"/>
  <text x="530" y="296" font-size="12" text-anchor="middle" fill="#3d2a07">charge-events</text>
  <text x="530" y="312" font-size="11" text-anchor="middle" fill="#6b5320">fanout exchange</text>

  <!-- lane 1: invoice (y=150) -->
  <rect x="650" y="128" width="150" height="44" rx="6" fill="#fff4e5" stroke="#d9922b" stroke-width="1.5"/>
  <text x="725" y="155" font-size="13" text-anchor="middle" fill="#3d2a07">invoice-queue</text>
  <rect x="650" y="200" width="150" height="38" rx="6" fill="#fff" stroke="#d9922b" stroke-dasharray="4 3"/>
  <text x="725" y="224" font-size="12" text-anchor="middle" fill="#6b5320">invoice-queue.dlq</text>
  <rect x="865" y="128" width="135" height="44" rx="6" fill="#e9f6ee" stroke="#4a9a6a" stroke-width="1.5"/>
  <text x="932" y="146" font-size="12.5" font-weight="600" text-anchor="middle" fill="#15301f">Invoice worker</text>
  <text x="932" y="162" font-size="10.5" text-anchor="middle" fill="#2a4a36">writes invoices</text>

  <!-- lane 2: email (y=300) -->
  <rect x="650" y="278" width="150" height="44" rx="6" fill="#fff4e5" stroke="#d9922b" stroke-width="1.5"/>
  <text x="725" y="305" font-size="13" text-anchor="middle" fill="#3d2a07">email-queue</text>
  <rect x="650" y="350" width="150" height="38" rx="6" fill="#fff" stroke="#d9922b" stroke-dasharray="4 3"/>
  <text x="725" y="374" font-size="12" text-anchor="middle" fill="#6b5320">email-queue.dlq</text>
  <rect x="865" y="278" width="135" height="44" rx="6" fill="#e9f6ee" stroke="#4a9a6a" stroke-width="1.5"/>
  <text x="932" y="296" font-size="12.5" font-weight="600" text-anchor="middle" fill="#15301f">Email worker</text>
  <text x="932" y="312" font-size="10.5" text-anchor="middle" fill="#2a4a36">sends receipts (mock)</text>

  <!-- lane 3: audit (y=450) -->
  <rect x="650" y="428" width="150" height="44" rx="6" fill="#fff4e5" stroke="#d9922b" stroke-width="1.5"/>
  <text x="725" y="455" font-size="13" text-anchor="middle" fill="#3d2a07">audit-queue</text>
  <rect x="650" y="500" width="150" height="38" rx="6" fill="#fff" stroke="#d9922b" stroke-dasharray="4 3"/>
  <text x="725" y="524" font-size="12" text-anchor="middle" fill="#6b5320">audit-queue.dlq</text>
  <rect x="865" y="428" width="135" height="44" rx="6" fill="#e9f6ee" stroke="#4a9a6a" stroke-width="1.5"/>
  <text x="932" y="446" font-size="12.5" font-weight="600" text-anchor="middle" fill="#15301f">Audit worker</text>
  <text x="932" y="462" font-size="10.5" text-anchor="middle" fill="#2a4a36">writes audit log</text>

  <!-- postgres -->
  <path d="M1050,150 v290 a60,12 0 0 0 120,0 v-290" fill="#eef3fb" stroke="#5b7db1" stroke-width="1.5"/>
  <ellipse cx="1110" cy="150" rx="60" ry="12" fill="#eef3fb" stroke="#5b7db1" stroke-width="1.5"/>
  <text x="1110" y="280" font-size="14" font-weight="600" text-anchor="middle" fill="#1b2a41">PostgreSQL</text>
  <text x="1110" y="304" font-size="11" text-anchor="middle" fill="#41536f">charges</text>
  <text x="1110" y="320" font-size="11" text-anchor="middle" fill="#41536f">webhook events</text>
  <text x="1110" y="336" font-size="11" text-anchor="middle" fill="#41536f">invoices</text>
  <text x="1110" y="352" font-size="11" text-anchor="middle" fill="#41536f">audit log</text>
  <text x="1110" y="368" font-size="11" text-anchor="middle" fill="#41536f">users</text>
  <text x="1110" y="384" font-size="11" text-anchor="middle" fill="#41536f">refresh tokens</text>

  <!-- arrows -->
  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M135,243 L198,264"/>
    <path d="M135,357 L198,336"/>
    <path d="M360,300 L468,300"/>
    <path d="M590,300 C615,300 625,150 648,150"/>
    <path d="M590,300 L648,300"/>
    <path d="M590,300 C615,300 625,450 648,450"/>
    <path d="M800,150 L863,150"/>
    <path d="M800,300 L863,300"/>
    <path d="M800,450 L863,450"/>
    <path d="M1000,150 L1048,170"/>
    <path d="M1000,450 L1048,430"/>
    <path d="M275,365 L275,625 L1110,625 L1110,456"/>
  </g>
  <g fill="none" stroke="#4b5563" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M280,235 L280,107"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <path d="M725,172 L725,198"/>
    <path d="M725,322 L725,348"/>
    <path d="M725,472 L725,498"/>
  </g>

  <!-- arrow labels -->
  <g font-size="11" fill="#374151">
    <text x="160" y="236" text-anchor="middle">REST + JWT</text>
    <text x="167" y="366" text-anchor="middle">webhook</text>
    <text x="414" y="285" text-anchor="middle">publish after</text>
    <text x="414" y="319" text-anchor="middle">DB commit</text>
    <text x="287" y="172" text-anchor="start">duplicate check</text>
    <text x="690" y="614" text-anchor="middle">read / write (charges, webhook events, users, refresh tokens)</text>
  </g>
  <g font-size="10.5" fill="#9a5b00" font-style="italic">
    <text x="734" y="190">after 3 failed attempts</text>
    <text x="734" y="340">after 3 failed attempts</text>
    <text x="734" y="490">after 3 failed attempts</text>
  </g>

  <text x="600" y="660" font-size="11.5" text-anchor="middle" fill="#6b7280" font-style="italic">Dead-letter queues are listed and replayed through the API's admin endpoints.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
