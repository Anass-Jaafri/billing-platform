spring:
  application:
    name: billing-workers

  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: billing
    password: billing
  jpa:
    hibernate:
      # workers never owns the schema — API's Flyway migrations are the only
      # source of truth. "validate" catches drift instead of silently allowing it.
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false # exhausted messages are dead-lettered, not looped

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
resilience4j:
  retry:
    instances:
      worker: # one shared policy for all three workers
        max-attempts: 3                    # total attempts, including the first call
        wait-duration: 1s                  # pause before the 2nd attempt
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2  # 1s before the 2nd attempt, 2s before the 3rd
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "