spring:
  application:
    name: billing-api

  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: billing
    password: billing
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# NOTE: values above target `docker compose up` (INFRA-2) for local dev.
# No profiles/secrets management yet — that's appropriately out of scope
# until the project needs an actual deployment target beyond local Docker.
