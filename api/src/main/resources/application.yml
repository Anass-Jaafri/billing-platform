spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: billing-api

  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: billing
    password: billing
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always        # per-dependency UP/DOWN, no internals
      show-details: when-authorized  # versions and queries: only for the roles below
      roles: ADMIN
      probes:
        enabled: true                # /actuator/health/liveness and /readiness
      group:
        liveness:
          include: livenessState     # never depends on Postgres/Rabbit/Redis
        readiness:
          include: readinessState,db,rabbit,redis
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
  auth:
    max-login-failures: 5
    login-failure-window: 15m