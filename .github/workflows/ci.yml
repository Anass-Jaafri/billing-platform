name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & test all modules
        run: mvn --batch-mode --update-snapshots verify

      # NOTE: once WH-7 / RES-6 / RES-7 / AUTH-7 land (Testcontainers-based
      # integration tests), this job needs Docker-in-Docker available, which
      # GitHub-hosted ubuntu-latest runners provide by default — no extra
      # service containers needed here since Testcontainers spins its own up.
